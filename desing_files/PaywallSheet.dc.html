<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link href="https://api.fontshare.com/v2/css?f[]=general-sans@500,600,700&f[]=satoshi@400,500,700&display=swap" rel="stylesheet">
  <style>
    body { margin:0; background:#0D0E11; }
    a { color:#FF6B47; text-decoration:none; }
    a:hover { color:#FF8A6B; }
  </style>
</helmet>

<div style="height:100%; overflow:hidden; background:#0D0E11; font-family:'Satoshi',sans-serif; color:#F4F5F7; position:relative;">

  <!-- dimmed home behind -->
  <div style="padding:64px 20px; opacity:0.3; filter:blur(2px);">
    <div style="font-family:'General Sans',sans-serif; font-weight:600; font-size:28px; letter-spacing:-0.02em;">Bugün</div>
    <div style="background:#15171C; border:1px solid #262A33; border-radius:24px; height:150px; margin-top:20px;"></div>
    <div style="background:#15171C; border:1px solid #262A33; border-radius:24px; height:150px; margin-top:12px;"></div>
  </div>
  <div style="position:absolute; inset:0; background:rgba(6,7,9,0.72);"></div>

  <!-- sheet -->
  <div style="position:absolute; left:0; right:0; bottom:0; background:#1D2027; border-radius:32px 32px 0 0; padding:16px 20px 40px;">
    <div style="width:36px; height:5px; border-radius:3px; background:#3A3F4A; margin:0 auto 8px;"></div>

    <div style="display:flex; justify-content:flex-end; margin-bottom:4px;">
      <button style="width:32px; height:32px; border-radius:50%; background:#262A33; border:none; cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0;">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7" stroke="#9AA0AC" stroke-width="1.5" stroke-linecap="round"></path></svg>
      </button>
    </div>

    <!-- hero ring motif -->
    <div style="display:flex; justify-content:center; margin-bottom:20px;">
      <div style="position:relative; width:88px; height:88px;">
        <svg width="88" height="88" viewBox="0 0 88 88">
          <sc-for list="{{ ringHero }}" as="s" hint-placeholder-count="14">
            <path d="{{ s.d }}" stroke="{{ s.stroke }}" stroke-width="{{ s.w }}" fill="none"></path>
          </sc-for>
        </svg>
        <div style="position:absolute; inset:0; display:flex; align-items:center; justify-content:center;">
          <div style="width:44px; height:44px; border-radius:50%; background:rgba(255,107,71,0.12); display:flex; align-items:center; justify-content:center;">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M9 3.5v11M3.5 9h11" stroke="#FF6B47" stroke-width="1.8" stroke-linecap="round"></path></svg>
          </div>
        </div>
      </div>
    </div>

    <div style="text-align:center; margin-bottom:24px;">
      <div style="font-family:'General Sans',sans-serif; font-weight:700; font-size:28px; letter-spacing:-0.02em; line-height:1.2;">{{ headline }}</div>
      <p style="font-size:15px; color:#9AA0AC; line-height:1.45; margin:8px auto 0; max-width:290px;">{{ sub }}</p>
    </div>

    <!-- features -->
    <div style="display:flex; flex-direction:column; gap:12px; margin-bottom:24px; padding:0 8px;">
      <div style="display:flex; align-items:center; gap:12px;">
        <div style="width:22px; height:22px; border-radius:50%; background:rgba(255,107,71,0.12); display:flex; align-items:center; justify-content:center; flex-shrink:0;">
          <svg width="11" height="11" viewBox="0 0 11 11" fill="none"><path d="M2 5.8l2.4 2.4L9 3.4" stroke="#FF6B47" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        </div>
        <span style="font-size:17px; font-weight:500;">Sınırsız aktif halka</span>
      </div>
      <div style="display:flex; align-items:center; gap:12px;">
        <div style="width:22px; height:22px; border-radius:50%; background:rgba(255,107,71,0.12); display:flex; align-items:center; justify-content:center; flex-shrink:0;">
          <svg width="11" height="11" viewBox="0 0 11 11" fill="none"><path d="M2 5.8l2.4 2.4L9 3.4" stroke="#FF6B47" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        </div>
        <span style="font-size:17px; font-weight:500;">Gelişmiş istatistikler</span>
      </div>
    </div>

    <!-- pricing -->
    <div style="display:flex; gap:10px; margin-bottom:20px;">
      <div style="flex:1; background:#15171C; border:1px solid #262A33; border-radius:16px; padding:16px;">
        <div style="font-size:13px; color:#9AA0AC;">Aylık</div>
        <div style="font-family:'General Sans',sans-serif; font-weight:700; font-size:20px; letter-spacing:-0.02em; font-variant-numeric:tabular-nums; margin-top:6px;">₺59<span style="font-size:13px; font-weight:500; color:#5D6370;">/ay</span></div>
        <div style="font-size:12px; color:#5D6370; margin-top:4px;">İstediğin an iptal</div>
      </div>
      <div style="flex:1.25; background:#15171C; border:1px solid #FF6B47; border-radius:16px; padding:16px; position:relative;">
        <div style="position:absolute; top:-9px; right:12px; background:rgba(224,179,76,0.12); border:1px solid rgba(224,179,76,0.4); color:#E0B34C; font-family:'General Sans',sans-serif; font-size:11px; font-weight:600; border-radius:12px; padding:2px 8px; white-space:nowrap;">2 ay bedava</div>
        <div style="display:flex; align-items:center; justify-content:space-between;">
          <div style="font-size:13px; color:#F4F5F7; font-weight:500;">Yıllık</div>
          <div style="width:16px; height:16px; border-radius:50%; background:#FF6B47; display:flex; align-items:center; justify-content:center;">
            <svg width="8" height="8" viewBox="0 0 11 11" fill="none"><path d="M2 5.8l2.4 2.4L9 3.4" stroke="#0D0E11" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
          </div>
        </div>
        <div style="font-family:'General Sans',sans-serif; font-weight:700; font-size:20px; letter-spacing:-0.02em; font-variant-numeric:tabular-nums; margin-top:6px;">₺399<span style="font-size:13px; font-weight:500; color:#5D6370;">/yıl</span></div>
        <div style="font-size:12px; color:#9AA0AC; margin-top:4px; font-variant-numeric:tabular-nums;">₺33/ay'a denk gelir</div>
      </div>
    </div>

    <button style="width:100%; height:56px; border-radius:28px; background:#FF6B47; color:#0D0E11; border:none; font-family:'Satoshi',sans-serif; font-size:17px; font-weight:700; cursor:pointer;">Halkora Pro'ya geç</button>

    <div style="text-align:center; margin-top:16px;">
      <button style="border:none; background:transparent; color:#9AA0AC; font-family:'Satoshi',sans-serif; font-size:14px; cursor:pointer;">Satın alımları geri yükle</button>
      <div style="font-size:12px; color:#5D6370; margin-top:8px;">Kullanım Koşulları · Gizlilik</div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;$preview&quot;: {&quot;width&quot;: 390, &quot;height&quot;: 844},
  &quot;headline&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;Halkora Pro&quot;, &quot;tsType&quot;: &quot;string&quot;},
  &quot;sub&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;Halkora'nın tamamını aç.&quot;, &quot;tsType&quot;: &quot;string&quot;}
}">
class Component extends DCLogic {
  pt(c, r, deg) {
    const a = (deg * Math.PI) / 180;
    return (c + r * Math.cos(a)).toFixed(2) + ' ' + (c + r * Math.sin(a)).toFixed(2);
  }
  renderVals() {
    const n = 14, size = 88, stroke = 7, gap = 5;
    const c = size / 2, r = (size - stroke) / 2, span = 360 / n;
    const ringHero = [];
    for (let i = 0; i < n; i++) {
      const a0 = -90 + i * span + gap / 2;
      const a1 = -90 + (i + 1) * span - gap / 2;
      const d = 'M ' + this.pt(c, r, a0) + ' A ' + r + ' ' + r + ' 0 0 1 ' + this.pt(c, r, a1);
      ringHero.push({ d, stroke: i < 10 ? '#FF6B47' : '#3A3F4A', w: stroke });
    }
    return { ringHero, headline: this.props.headline ?? 'Halkora Pro', sub: this.props.sub ?? "Halkora'nın tamamını aç." };
  }
}
</script>
</body>
</html>
